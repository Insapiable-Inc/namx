name: GUI — Linux build

on:
  push:
    branches: [linux-gui, gui-beautification, windows-compatibility, main]
    paths:
      - 'gui/**'
      - 'NAM/**'
      - 'Dependencies/**'
      - '.github/workflows/gui-linux.yml'
  pull_request:
    paths:
      - 'gui/**'
      - 'NAM/**'
      - '.github/workflows/gui-linux.yml'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-14 \
            qt6-base-dev qt6-base-dev-tools \
            libjack-jackd2-dev libasound2-dev pkg-config \
            libgl1-mesa-dev \
            desktop-file-utils appstream python3

      - name: Configure (Release)
        working-directory: gui
        env:
          CXX: g++-14 # C++23; 24.04 defaults to GCC 13
        run: |
          cmake -S . -B build-release \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DNAM_NATIVE_OPT=OFF \
                -DNAM_BUILD_TESTS=ON

      - name: Build
        working-directory: gui
        run: cmake --build build-release --parallel

      - name: Smoke test (headless) + client test
        working-directory: gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # No JACK on the runner: the backend reports "Not connected" and the
          # window still has to come up, scan the library and exit 0.
          ./build-release/NAMPlayer --version
          timeout 30 ./build-release/NAMPlayer --self-test-and-exit
          ./build-release/Tone3000ClientTest

      - name: Packaging files + install layout
        working-directory: gui
        run: |
          desktop-file-validate packaging/cl.pichulero.NAMPlayer.desktop
          appstreamcli validate --no-net packaging/cl.pichulero.NAMPlayer.metainfo.xml || true
          xmllint --noout packaging/cl.pichulero.NAMPlayer.xml
          DESTDIR="$PWD/stage" cmake --install build-release --prefix /usr
          test -f stage/usr/bin/NAMPlayer
          test -f stage/usr/share/applications/cl.pichulero.NAMPlayer.desktop

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NAMPlayer-linux-x64
          path: gui/build-release/NAMPlayer
          retention-days: 14
