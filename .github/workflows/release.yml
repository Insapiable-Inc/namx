name: Release

# Tag push (v1.0.0, v1.1.0-rc1, …) → portable builds for Linux (AppImage,
# Ubuntu 22.04 base), Arch (build + tests only), Windows (windeployqt zip),
# a source tarball with the submodules vendored (for the AUR PKGBUILD), and a
# GitHub release carrying all of them. Every build uses -DNAM_NATIVE_OPT=OFF
# (portable AVX2/FMA) and the TONE3000 key from the TONE3000_CLIENT_ID secret.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  T3K_KEY: ${{ secrets.TONE3000_CLIENT_ID }}

jobs:
  source:
    name: Source tarball (submodules vendored)
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || V="$(git describe --tags --always | sed 's/^v//')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Pack
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p out
          tar --exclude-vcs --exclude='./out' --transform "s,^\.,nam-player-$V," \
              -czf "out/nam-player-$V-src.tar.gz" .
          (cd out && sha256sum "nam-player-$V-src.tar.gz" > "nam-player-$V-src.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: out/*

  linux:
    name: Linux (Ubuntu 22.04, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            libjack-jackd2-dev pkg-config libgl1-mesa-dev libfuse2 \
            desktop-file-utils appstream python3
      - name: Configure (portable, tests on)
        working-directory: gui
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAM_NATIVE_OPT=OFF \
            -DNAM_BUILD_TESTS=ON \
            -DNAM_TONE3000_CLIENT_ID="$T3K_KEY"
      - name: Build
        working-directory: gui
        run: cmake --build build-release --parallel
      - name: Smoke test + client test
        working-directory: gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build-release/NAMPlayer --version
          timeout 30 ./build-release/NAMPlayer --self-test-and-exit
          ./build-release/Tone3000ClientTest
      - name: Validate packaging files
        run: |
          desktop-file-validate gui/packaging/cl.pichulero.NAMPlayer.desktop
          appstreamcli validate --no-net gui/packaging/cl.pichulero.NAMPlayer.metainfo.xml || true
          xmllint --noout gui/packaging/cl.pichulero.NAMPlayer.xml
      - name: AppImage
        working-directory: gui
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          ./packaging/appimage.sh build-release
          ls -la build-appimage/*.AppImage
          (cd build-appimage && sha256sum *.AppImage > NAMPlayer-x86_64.AppImage.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            gui/build-appimage/*.AppImage
            gui/build-appimage/*.sha256

  arch:
    name: Arch Linux (build + tests)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base jack2 python
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure + build (portable, tests on)
        working-directory: gui
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAM_NATIVE_OPT=OFF \
            -DNAM_BUILD_TESTS=ON \
            -DNAM_TONE3000_CLIENT_ID="$T3K_KEY"
          cmake --build build-release --parallel
      - name: Smoke test + client test + install layout
        working-directory: gui
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build-release/NAMPlayer --version
          timeout 30 ./build-release/NAMPlayer --self-test-and-exit
          ./build-release/Tone3000ClientTest
          DESTDIR="$PWD/stage" cmake --install build-release --prefix /usr
          find stage -type f | sort

  windows:
    name: Windows (MSVC 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt 6.7 (MSVC 2019 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure (Release, Ninja)
        working-directory: gui
        shell: pwsh
        run: |
          cmake -S . -B build-release `
                -G Ninja `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
                -DNAM_TONE3000_CLIENT_ID="$env:T3K_KEY"
      - name: Build
        working-directory: gui
        run: cmake --build build-release --parallel
      - name: windeployqt + zip
        working-directory: gui
        shell: pwsh
        run: |
          $exe = "build-release\NAMPlayer.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $windeployqt = Join-Path "$env:QT_ROOT_DIR" "bin\windeployqt.exe"
          & $windeployqt $exe --release --no-translations --no-system-d3d-compiler --no-opengl-sw
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          New-Item -ItemType Directory -Force dist\NAMPlayer | Out-Null
          Copy-Item build-release\NAMPlayer.exe, build-release\*.dll dist\NAMPlayer\
          foreach ($d in 'platforms','styles','imageformats','iconengines','tls','networkinformation') {
            if (Test-Path "build-release\$d") { Copy-Item -Recurse "build-release\$d" "dist\NAMPlayer\$d" }
          }
          Copy-Item ..\LICENSE dist\NAMPlayer\LICENSE.txt
          $v = "${env:GITHUB_REF_NAME}" -replace '^v',''
          Compress-Archive -Path dist\NAMPlayer -DestinationPath "dist\NAMPlayer-$v-windows-x64.zip"
          Get-FileHash "dist\NAMPlayer-$v-windows-x64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  NAMPlayer-$v-windows-x64.zip" } | Set-Content "dist\NAMPlayer-$v-windows-x64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            gui/dist/*.zip
            gui/dist/*.sha256

  release:
    name: GitHub release
    needs: [source, linux, arch, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          name: NAM Player ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/source/*
            artifacts/linux-appimage/*
            artifacts/windows/*
