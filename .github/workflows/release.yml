name: Release

# Tag push (v0.0.0, v0.1.0-rc1, …) → build + tests on Ubuntu 24.04 and Arch, an
# AppImage, a Windows
# windeployqt zip, a source tarball with the submodules vendored, and a GitHub
# release. Every build uses -DNAM_NATIVE_OPT=OFF
# (portable AVX2/FMA).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The write token only where it is used (the release job); the build jobs, the
# unpinned Arch container among them, get a read-only one.
permissions:
  contents: read

jobs:
  source:
    name: Source tarball (submodules vendored)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || V="$(git describe --tags --always | sed 's/^v//')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches CMake and the metainfo
        if: github.ref_type == 'tag'
        run: |
          V="${{ steps.ver.outputs.version }}"
          CMAKE=$(sed -n 's/^project(namx VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          META=$(grep -o '<release version="[^"]*"' packaging/io.github.Insapiable_Inc.namx.metainfo.xml | head -1 | sed 's/.*="\(.*\)"/\1/')
          echo "tag $V · CMakeLists $CMAKE · metainfo $META"
          [ "$V" = "$CMAKE" ] && [ "$V" = "$META" ]
      - name: Pack
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p out
          tar --exclude-vcs --exclude='./out' --transform "s,^\.,namx-$V," \
              -czf "out/namx-$V-src.tar.gz" .
          (cd out && sha256sum "namx-$V-src.tar.gz" > "namx-$V-src.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: out/*

  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 qt6-base-dev qt6-base-dev-tools \
            libjack-jackd2-dev libasound2-dev pkg-config libgl1-mesa-dev \
            desktop-file-utils appstream libxml2-utils python3
      - name: Configure (portable, tests on)
        env:
          CXX: g++-14 # C++23; 24.04 defaults to GCC 13
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAM_NATIVE_OPT=OFF \
            -DNAM_WERROR=ON \
            -DNAM_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-release --parallel
      - name: Smoke test + client test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build-release/namx --version
          timeout 30 ./build-release/namx --self-test-and-exit
          ./build-release/MidiMapperTest
          ./build-release/DspGoldenTest
          ./build-release/WavReaderTest
          ./build-release/NamProcessorTest
          ./build-release/LibraryIndexTest
          ./build-release/ThemeFileTest
      - name: Validate packaging files + install layout
        run: |
          desktop-file-validate packaging/io.github.Insapiable_Inc.namx.desktop
          appstreamcli validate --no-net packaging/io.github.Insapiable_Inc.namx.metainfo.xml
          xmllint --noout packaging/io.github.Insapiable_Inc.namx.xml
          DESTDIR="$PWD/stage" cmake --install build-release --prefix /usr
          find stage -type f | sort

  appimage:
    name: AppImage (x86_64)
    # Built on 24.04: its libstdc++ is GCC 14's, so the C++23 build needs no bundled
    # libstdc++ (bundling one breaks hosts whose GL drivers want a newer one). The
    # price is glibc 2.39: Ubuntu 24.04, Debian 13, Fedora 40 and newer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 qt6-base-dev qt6-base-dev-tools \
            qt6-wayland qt6-xdgdesktopportal-platformtheme libjack-jackd2-dev libasound2-dev \
            pkg-config libgl1-mesa-dev \
            libfuse2t64 file
      - name: Configure + build (portable)
        env:
          CXX: g++-14
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAM_NATIVE_OPT=OFF \
            -DNAM_WERROR=ON
          cmake --build build-release --parallel
          DESTDIR="$PWD/AppDir" cmake --install build-release --prefix /usr
      - name: linuxdeploy + Qt plugin
        run: |
          base=https://github.com/linuxdeploy
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
      - name: Build the AppImage
        env:
          QMAKE: /usr/lib/qt6/bin/qmake
          # Wayland next to the default xcb; offscreen for the headless smoke test.
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so;libqoffscreen.so
          EXTRA_QT_PLUGINS: wayland-shell-integration;wayland-decoration-client;wayland-graphics-integration-client
          # AppImageUpdate / Gear Lever find updates in the GitHub releases.
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|Insapiable-Inc|namx|latest|NAM-X-*-x86_64.AppImage.zsync
        run: |
          V="${GITHUB_REF_NAME#v}"
          export LDAI_OUTPUT="NAM-X-$V-x86_64.AppImage"
          # The XDG portal theme (main.cpp asks for it: the desktop's own file dialogs);
          # the Qt plugin doesn't deploy platform themes on its own.
          mkdir -p AppDir/usr/plugins/platformthemes
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/platformthemes/libqxdgdesktopportal.so \
             AppDir/usr/plugins/platformthemes/
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/io.github.Insapiable_Inc.namx.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/io.github.Insapiable_Inc.namx.png \
            --deploy-deps-only AppDir/usr/plugins/platformthemes \
            --plugin qt --output appimage
          test -f AppDir/usr/plugins/platformthemes/libqxdgdesktopportal.so
          # libjack must come from the host (JACK or PipeWire), never from the bundle.
          if find AppDir -name 'libjack*' | grep .; then echo 'libjack is bundled'; exit 1; fi
          mkdir -p dist && mv NAM-X-*.AppImage NAM-X-*.zsync dist/
          (cd dist && sha256sum NAM-X-*.AppImage > "$LDAI_OUTPUT.sha256")
      - name: Smoke test the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE needed on the runner
        run: |
          ./dist/NAM-X-*-x86_64.AppImage --version
          timeout 30 ./dist/NAM-X-*-x86_64.AppImage --self-test-and-exit
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*

  arch:
    name: Arch Linux (build + tests)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base jack2 alsa-lib python
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure + build (portable, tests on)
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAM_NATIVE_OPT=OFF \
            -DNAM_WERROR=ON \
            -DNAM_BUILD_TESTS=ON
          cmake --build build-release --parallel
      - name: Smoke test + client test + install layout
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build-release/namx --version
          timeout 30 ./build-release/namx --self-test-and-exit
          ./build-release/MidiMapperTest
          ./build-release/DspGoldenTest
          ./build-release/WavReaderTest
          ./build-release/NamProcessorTest
          ./build-release/LibraryIndexTest
          ./build-release/ThemeFileTest
          DESTDIR="$PWD/stage" cmake --install build-release --prefix /usr
          find stage -type f | sort

  windows:
    name: Windows (MSVC 2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt 6.7 (MSVC 2019 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure (Release, Ninja)
        shell: pwsh
        run: |
          cmake -S . -B build-release `
                -G Ninja `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build build-release --parallel
      - name: windeployqt + zip
        shell: pwsh
        run: |
          $exe = "build-release\namx.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $windeployqt = Join-Path "$env:QT_ROOT_DIR" "bin\windeployqt.exe"
          # --compiler-runtime: the MSVC runtime installer (vc_redist.x64.exe) ships in
          # the zip; without it a clean Windows fails at launch with no message.
          & $windeployqt $exe --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          New-Item -ItemType Directory -Force dist\namx | Out-Null
          Copy-Item build-release\namx.exe, build-release\*.dll dist\namx\ -Exclude Qt6Network.dll
          Copy-Item build-release\vc_redist*.exe dist\namx\ -ErrorAction SilentlyContinue
          # No networking in NAM-X: windeployqt's Qt6Network and its tls / networkinformation
          # plugins are left out (the app runs without them).
          foreach ($d in 'platforms','styles','imageformats','iconengines') {
            if (Test-Path "build-release\$d") { Copy-Item -Recurse "build-release\$d" "dist\namx\$d" }
          }
          Copy-Item LICENSE dist\namx\LICENSE.txt
          Copy-Item LICENSE-MIT dist\namx\LICENSE-MIT.txt
          $v = "${env:GITHUB_REF_NAME}" -replace '^v',''
          Compress-Archive -Path dist\namx -DestinationPath "dist\namx-$v-windows-x64.zip"
          Get-FileHash "dist\namx-$v-windows-x64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  namx-$v-windows-x64.zip" } | Set-Content "dist\namx-$v-windows-x64.zip.sha256"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
          $v = "${env:GITHUB_REF_NAME}" -replace '^v',''
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\dist\namx" "/DOutputDir=$PWD\dist" packaging\windows\namx.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $setup = "namx-$v-windows-x64-setup.exe"
          Get-FileHash "dist\$setup" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $setup" } | Set-Content "dist\$setup.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256

  release:
    name: GitHub release
    needs: [source, linux, appimage, arch, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for the release notes (docs/release-notes/<tag>.md).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          name: NAM-X ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/source/*
            artifacts/appimage/*
            artifacts/windows/*
