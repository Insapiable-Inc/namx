name: Flatpak

# Builds packaging/flatpak/io.github.Insapiable_Inc.namx.yml from this checkout into
# a test bundle (ROADMAP Phase 8). Flathub builds its own copy of the manifest; this
# job keeps ours buildable and hands the release a .flatpak to try.

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak bundle (KDE 6.11)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: namx.flatpak
          manifest-path: packaging/flatpak/io.github.Insapiable_Inc.namx.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: No bundled libjack
        run: |
          # The app must use the runtime's (PipeWire's) libjack, never its own. Check
          # the app's own files in the bundle (not the runtime's).
          flatpak install --user -y --noninteractive namx.flatpak
          files="$(flatpak info --show-location --user io.github.Insapiable_Inc.namx)/files"
          find "$files" -type f | sort
          ! find "$files" -name 'libjack*' | grep .
