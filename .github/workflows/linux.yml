name: Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-14 \
            qt6-base-dev qt6-base-dev-tools \
            libjack-jackd2-dev libasound2-dev pkg-config \
            libgl1-mesa-dev \
            desktop-file-utils appstream python3 valgrind

      - name: Check formatting (.clang-format)
        run: |
          # Pinned to the major version the code is formatted with; others differ slightly.
          pipx install 'clang-format==22.*'
          find src tests bench \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure (Release)
        env:
          CXX: g++-14 # C++23; 24.04 defaults to GCC 13
        run: |
          cmake -S . -B build-release \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DNAM_NATIVE_OPT=OFF \
                -DNAM_WERROR=ON \
                -DNAM_BUILD_TESTS=ON \
                -DNAM_BUILD_BENCH=ON

      - name: Build
        run: cmake --build build-release --parallel

      - name: Smoke test (headless) + client test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # No JACK on the runner: the backend reports "Not connected" and the
          # window still has to come up, scan the library and exit 0.
          ./build-release/namx --version
          timeout 30 ./build-release/namx --self-test-and-exit
          ./build-release/MidiMapperTest
          ./build-release/DspGoldenTest
          ./build-release/WavReaderTest
          ./build-release/NamProcessorTest
          ./build-release/LibraryIndexTest

      - name: CPU regression (instructions per block, callgrind)
        # Counts per compiler (bench/instructions-baseline.json). Until this
        # runner's compiler has an entry the step only reports; record one by running
        # the script with --update on the same toolchain and committing the file.
        run: |
          python3 bench/instructions.py \
            --bench build-release/namx-bench \
            --baseline bench/instructions-baseline.json

      - name: Packaging files + install layout
        run: |
          desktop-file-validate packaging/io.github.Insapiable_Inc.namx.desktop
          appstreamcli validate --no-net packaging/io.github.Insapiable_Inc.namx.metainfo.xml
          xmllint --noout packaging/io.github.Insapiable_Inc.namx.xml
          DESTDIR="$PWD/stage" cmake --install build-release --prefix /usr
          test -f stage/usr/bin/namx
          test -f stage/usr/share/applications/io.github.Insapiable_Inc.namx.desktop

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: namx-linux-x64
          path: build-release/namx
          retention-days: 14
